<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Autofill · Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <h3 style="margin:0;">Settings</h3>
    <button id="closeOptions" title="Close" style="width:auto;padding:6px 10px;">✕</button>
  </div>

  <label>Model:</label>
  <select id="model">
    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
    <option value="gemini-2.5-flash" selected>gemini-2.5-flash</option>
    <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
  </select>

  <label>API Key:</label>
  <input id="apiKey" type="password" placeholder="sk-... or Google AI Studio key">

  <div class="row">
    <button id="save">Save</button>
    <button id="test">Test</button>
  </div>

  <div class="tip">Note: Config and resume stay in your browser. Nothing is sent unless you call the API.</div>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
