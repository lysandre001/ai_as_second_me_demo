<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2100" viewBox="0 0 1500 2100" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .col-title { font-size: 20px; font-weight: 700; fill: #1a1a1a; }
      .desc-box { fill: #f7f7f7; stroke: #aaa; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .desc-text { font-size: 13px; fill: #222; }
      .user-bubble { fill: #d4e8c4; stroke: #8fb86e; stroke-width: 1; }
      .ai-bubble { fill: #c5d9ef; stroke: #6a9fd4; stroke-width: 1; }
      .bubble-text { font-size: 12px; fill: #1a1a1a; }
      .link-line { stroke: #888; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
      .solid-link { stroke: #666; stroke-width: 1.5; fill: none; }
      .caption { font-size: 15px; font-weight: 700; fill: #111; }
    </style>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.5" fill="#666"/></marker>
  </defs>

  <text x="60" y="50" class="col-title">Description</text>
  <text x="420" y="50" class="col-title">Vibe Coding Conversation User-AI</text>
  <text x="980" y="50" class="col-title">Vibe Coded Artifact</text>

  <!-- Row 1 y~90 -->
  <rect x="30" y="80" width="340" height="95" rx="14" class="desc-box"/>
  <text x="48" y="108" class="desc-text"><tspan x="48" dy="0">Starting the dialog, the user vaguely states their</tspan><tspan x="48" dy="18">goal and describes the intent in natural language.</tspan></text>
  <path d="M 370 128 L 410 128" class="link-line" marker-end="url(#dot)"/>
  <rect x="410" y="88" width="520" height="78" rx="12" class="user-bubble"/>
  <text x="428" y="112" class="bubble-text"><tspan x="428" dy="0">I want to build an app in which I can save and rate coffees that I have tried.</tspan><tspan x="428" dy="16">Do you have a suggestion for this?</tspan></text>

  <!-- Row 2 y~210 -->
  <rect x="30" y="210" width="340" height="105" rx="14" class="desc-box"/>
  <text x="48" y="238" class="desc-text"><tspan x="48" dy="0">AI interprets mediated intent, starts concretizing the goal.</tspan><tspan x="48" dy="18">The dialogic flow is kept by asking for feedback.</tspan></text>
  <path d="M 370 262 L 410 262" class="link-line"/>
  <rect x="410" y="200" width="520" height="125" rx="12" class="ai-bubble"/>
  <text x="428" y="222" class="bubble-text"><tspan x="428" dy="0">That sounds like a great idea! To get started, let's break down the features:</tspan><tspan x="428" dy="16">1. View all the coffee ratings  2. Add new coffees with ratings</tspan><tspan x="428" dy="16">3. Store everything in a database. Does that sound about right?</tspan></text>

  <!-- Row 3 y~360 -->
  <rect x="30" y="360" width="340" height="85" rx="14" class="desc-box"/>
  <text x="48" y="388" class="desc-text"><tspan x="48" dy="0">User picks up dialogic flow and refines goal, letting it evolve.</tspan></text>
  <path d="M 370 402 L 410 402" class="link-line"/>
  <rect x="410" y="355" width="520" height="78" rx="12" class="user-bubble"/>
  <text x="428" y="378" class="bubble-text"><tspan x="428" dy="0">Yes, that sounds perfect! I would also like to describe the coffee notes</tspan><tspan x="428" dy="16">and add the coffee roaster.</tspan></text>

  <!-- Row 4 y~490 + Artifact wireframe -->
  <rect x="30" y="490" width="340" height="85" rx="14" class="desc-box"/>
  <text x="48" y="518" class="desc-text"><tspan x="48" dy="0">AI keeps dialogic flow, implements and presents artifact.</tspan></text>
  <path d="M 370 532 L 410 532" class="link-line"/>
  <rect x="410" y="478" width="520" height="78" rx="12" class="ai-bubble"/>
  <text x="428" y="502" class="bubble-text"><tspan x="428" dy="0">Great! Let's add those features. For the initial design, we can start with a simple layout.</tspan></text>
  <path d="M 930 518 L 980 518" class="solid-link" marker-end="url(#dot)"/>
  <rect x="980" y="460" width="460" height="210" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <text x="1000" y="492" font-size="22" font-weight="700">My Coffee Ratings</text>
  <text x="1000" y="518" font-size="13" fill="#2563eb">Add New Coffee</text>
  <rect x="1000" y="532" width="420" height="120" rx="4" fill="#fafafa" stroke="#ddd"/>
  <text x="1014" y="558" font-size="16" font-weight="700">Arabica</text>
  <text x="1014" y="578" font-size="12">Roaster: Coffee Roaster</text>
  <text x="1014" y="596" font-size="12">Rating: <tspan fill="#c00" font-weight="600">4/5</tspan></text>
  <text x="1014" y="614" font-size="12">Notes: Chocolate</text>
  <text x="1014" y="638" font-size="10" fill="#888">Added: 2025-05-23 12:18:28.623171</text>

  <!-- Row 5 y~720 -->
  <rect x="30" y="720" width="340" height="105" rx="14" class="desc-box"/>
  <text x="48" y="748" class="desc-text"><tspan x="48" dy="0">After being introduced to the artifact, the user is animated to</tspan><tspan x="48" dy="18">creatively engage with it and their goal.</tspan></text>
  <path d="M 370 772 L 410 772" class="link-line"/>
  <rect x="410" y="708" width="520" height="105" rx="12" class="user-bubble"/>
  <text x="428" y="732" class="bubble-text"><tspan x="428" dy="0">That looks great! Do you have a suggestion for a nicer design? I want to</tspan><tspan x="428" dy="16">incorporate the colors of coffee in the design.</tspan></text>

  <!-- Row 6 y~870 + Themed artifact -->
  <rect x="30" y="870" width="340" height="95" rx="14" class="desc-box"/>
  <text x="48" y="898" class="desc-text"><tspan x="48" dy="0">AI interprets refinement intentions and changes the artifact accordingly.</tspan></text>
  <path d="M 370 917 L 410 917" class="link-line"/>
  <rect x="410" y="858" width="520" height="105" rx="12" class="ai-bubble"/>
  <text x="428" y="882" class="bubble-text"><tspan x="428" dy="0">Absolutely! I suggest a coffee-themed design using warm browns, creams,</tspan><tspan x="428" dy="16">and complementary colors.</tspan></text>
  <path d="M 930 910 L 980 910" class="solid-link" marker-end="url(#dot)"/>
  <rect x="980" y="720" width="460" height="280" rx="10" fill="#f5ebe0" stroke="#8b6914" stroke-width="2"/>
  <rect x="980" y="720" width="460" height="44" fill="#e8dcc8" rx="10"/>
  <text x="1000" y="750" font-size="22" font-weight="700" fill="#5c4033">My Coffee Ratings</text>
  <rect x="1000" y="778" width="150" height="34" rx="17" fill="#6f4e37"/>
  <text x="1018" y="800" font-size="12" fill="#fff" font-weight="600">Add New Coffee</text>
  <rect x="1000" y="828" width="420" height="155" rx="8" fill="#fff" stroke="#a08060"/>
  <text x="1014" y="858" font-size="16" font-weight="700" fill="#5c4033">Arabica</text>
  <text x="1014" y="878" font-size="12" fill="#5c5048">Roaster: Coffee Roaster</text>
  <text x="1014" y="898" font-size="12" fill="#5c5048">Rating: <tspan fill="#b8860b" font-weight="600">4/5</tspan></text>
  <text x="1014" y="918" font-size="12" fill="#5c5048">Notes: Chocolate</text>
  <text x="1014" y="948" font-size="10" fill="#888">Added: 2025-05-23 12:18:28.623171</text>

  <text x="30" y="1040" class="caption">FIGURE 1. Dialogue between human user (green) and AI (blue) illustrating a vibe coding process.</text>
</svg>
